<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Contact Form</title>
</head>
<body>
  <h1>Contact Information</h1>

  <form id="contactForm" name="contactForm" autocomplete="on">
    <section>
      <label for="firstname">Firstname:</label>
      <input type="text" id="firstname" name="firstname" required>
    </section>

    <section>
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required>
    </section>

    <section>
      <label for="age">Age:</label>
      <input type="number" id="age" name="age" min="0" max="150" step="1" required>
    </section>

    <section>
      <label for="phone">Phone:</label>
      <input type="tel" id="phone" name="phone" placeholder="+212..." required>
    </section>

    <section>
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>
    </section>

    <section>
      <input type="checkbox" id="student" name="student" value="yes">
      <label for="student">Student at 42?</label>
    </section>

    <fieldset>
      <legend>Gender:</legend>
      <section>
        <input type="radio" id="gender_male" name="gender" value="Male" required>
        <label for="gender_male">Male</label>
      </section>
      <section>
        <input type="radio" id="gender_female" name="gender" value="Female">
        <label for="gender_female">Female</label>
      </section>
      <section>
        <input type="radio" id="gender_other" name="gender" value="Other">
        <label for="gender_other">Other</label>
      </section>
    </fieldset>

    <section>
      <button type="button" onclick="displayFormContents()">Submit</button>
    </section>
  </form>

  <script src="popup.js"></script>
</body>
</html>
