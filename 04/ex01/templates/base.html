<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ex01{% endblock %}</title>
    {% block style %}
    <link rel="stylesheet" href="{% static 'css/style1.css' %}">
    {% endblock %}
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
    </style>
</head>
<body>
    {% include 'nav.html' %}
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
